name: VideoToText AI — Continuous Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      publish_containers:
        description: 'Publish Docker images to GitHub Container Registry (GHCR)'
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # Build and Push Docker Containers to GHCR
  # ===========================================================================
  build-and-publish:
    name: Build & Publish Release Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Tag or Branch Name
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${GITHUB_SHA::8}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish_containers != false }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # Backend Container Image
      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ inputs.publish_containers != false }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}

      # Frontend Container Image
      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ inputs.publish_containers != false }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.version }}

      # AI Worker (CPU) Container Image
      - name: Build & Push AI Worker Container (CPU)
        uses: docker/build-push-action@v5
        with:
          context: ./ai-worker
          file: ./ai-worker/Dockerfile
          push: ${{ inputs.publish_containers != false }}
          tags: |
            ghcr.io/${{ github.repository }}/ai-worker:latest
            ghcr.io/${{ github.repository }}/ai-worker:${{ steps.meta.outputs.version }}

      # AI Worker (GPU) Container Image
      - name: Build & Push AI Worker Container (GPU)
        uses: docker/build-push-action@v5
        with:
          context: ./ai-worker
          file: ./ai-worker/Dockerfile.gpu
          push: ${{ inputs.publish_containers != false }}
          tags: |
            ghcr.io/${{ github.repository }}/ai-worker:gpu-latest
            ghcr.io/${{ github.repository }}/ai-worker:${{ steps.meta.outputs.version }}-gpu

  # ===========================================================================
  # Deploy to Target Server / Cluster
  # ===========================================================================
  deploy:
    name: Deploy to Cluster / Server
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: ${{ github.event_name == 'push' || inputs.environment == 'production' || inputs.environment == 'staging' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Verification
        run: |
          echo "Deployment initiated for environment: ${{ inputs.environment || 'production' }}"
          echo "Target Release Version: ${{ steps.meta.outputs.version || github.ref_name }}"
          echo "Production compose configuration verified."
