apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: videototext
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/videototext/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: videototext-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/videototext_prod"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq-service"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: RABBITMQ_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: RABBITMQ_PASSWORD
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: RABBITMQ_VHOST
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: REDIS_PASSWORD
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: JWT_SECRET
            - name: APP_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: videototext-config
                  key: S3_ENDPOINT
            - name: APP_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: videototext-config
                  key: S3_BUCKET
            - name: APP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: MINIO_ROOT_USER
            - name: APP_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: videototext
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: backend
