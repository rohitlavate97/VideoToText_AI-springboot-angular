apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: videototext
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      containers:
        - name: ai-worker
          image: ghcr.io/videototext/ai-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: health
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq-service"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_VHOST
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: RABBITMQ_VHOST
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: REDIS_PASSWORD
            - name: S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: videototext-config
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: videototext-config
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: videototext-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: WORKER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: videototext-config
                  key: WORKER_CONCURRENCY
            - name: DEFAULT_ASR_MODEL
              valueFrom:
                configMapKeyRef:
                  name: videototext-config
                  key: DEFAULT_ASR_MODEL
            - name: DEFAULT_COMPUTE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: videototext-config
                  key: DEFAULT_COMPUTE_TYPE
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 4000m
              memory: 4096Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-worker-service
  namespace: videototext
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: ai-worker
