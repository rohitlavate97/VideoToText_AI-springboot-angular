# ============================================================
# VideoToText AI — Application Configuration
# ============================================================

spring:
  application:
    name: videototext-backend

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  # ---- Flyway ----
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ---- Jackson ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC

  # ---- File Upload ----
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB
      file-size-threshold: 10MB

  # ---- Security (permit Swagger & Actuator in dev) ----
  security:
    filter:
      order: 10

# ---- Server ----
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# ---- OpenAPI ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ---- Application Custom Properties ----
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-64-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:videototext}
    region: us-east-1
  video:
    max-duration-minutes: ${MAX_VIDEO_DURATION_MINUTES:240}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:10737418240}
    allowed-extensions: mp4,mkv,avi,mov,webm,flv,wmv,mpeg,3gp
  processing:
    mode: ${PROCESSING_MODE:local}
    chunk-duration-seconds: ${CHUNK_DURATION_SECONDS:600}
  quota:
    max-storage-per-user-bytes: ${MAX_STORAGE_PER_USER_BYTES:21474836480}
    max-concurrent-processing-jobs: ${MAX_CONCURRENT_PROCESSING_JOBS:3}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-limit: ${RATE_LIMIT_AUTH:20}
    upload-limit: ${RATE_LIMIT_UPLOAD:15}
    default-limit: ${RATE_LIMIT_DEFAULT:120}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

# ---- Logging ----
logging:
  level:
    root: INFO
    com.videototext: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
