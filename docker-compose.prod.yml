# =============================================================================
# VideoToText AI — Production Multi-Container Compose Architecture
# =============================================================================
services:
  # ===========================================================================
  # 1. PostgreSQL 16 — Primary Relational Store
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: videototext-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videototext_prod}
      POSTGRES_USER: ${POSTGRES_USER:-videototext_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c max_connections=200
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - videototext-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videototext_user} -d ${POSTGRES_DB:-videototext_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # 2. RabbitMQ 3.13 — Reliable Message Broker
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: videototext-rabbitmq-prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-videototext_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RabbitMQ password must be provided}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-videototext}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+P 1048576"
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    networks:
      - videototext-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M

  # ===========================================================================
  # 3. Redis 7 — Cache, Idempotency Guard & State Store
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: videototext-redis-prod
    restart: always
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?Redis password must be provided}"
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - videototext-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ===========================================================================
  # 4. MinIO — S3-Compatible Storage (Production / Self-Hosted S3)
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: videototext-minio-prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MinIO access key must be provided}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO secret key must be provided}
      MINIO_BROWSER: "off"
    volumes:
      - minio_prod_data:/data
    networks:
      - videototext-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: videototext-minio-init-prod
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - videototext-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET:-videototext};
      exit 0;
      "

  # ===========================================================================
  # 5. Spring Boot 3.5.x Backend API Service
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: videototext-backend:latest
    container_name: videototext-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-videototext_prod}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-videototext_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-videototext_admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-videototext}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET:?JWT secret must be configured}
      APP_JWT_ACCESS_EXPIRATION_MS: 900000
      APP_JWT_REFRESH_EXPIRATION_MS: 604800000
      APP_S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      APP_S3_BUCKET: ${MINIO_BUCKET:-videototext}
      APP_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      APP_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      APP_S3_REGION: ${S3_REGION:-us-east-1}
      APP_CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://videototext.ai,http://localhost}
    networks:
      - videototext-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M

  # ===========================================================================
  # 6. Python AI Worker (Transcription, Diarization, Translation)
  # ===========================================================================
  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    image: videototext-ai-worker:latest
    container_name: videototext-ai-worker-prod
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-videototext_admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-videototext}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT_URL: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${MINIO_BUCKET:-videototext}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION:-us-east-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DEFAULT_ASR_MODEL: ${DEFAULT_ASR_MODEL:-large-v3}
      DEFAULT_COMPUTE_TYPE: ${DEFAULT_COMPUTE_TYPE:-int8}
      LOG_LEVEL: INFO
    networks:
      - videototext-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 2048M

  # ===========================================================================
  # 7. Angular 17 Frontend Web Application
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: videototext-frontend:latest
    container_name: videototext-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - videototext-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ===========================================================================
  # 8. Production Nginx Gateway & Reverse Proxy (SSL / TLS & SSE)
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: videototext-nginx-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/nginx/production.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - videototext-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

# =============================================================================
# Networks & Persistent Volumes
# =============================================================================
networks:
  videototext-net:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  rabbitmq_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  minio_prod_data:
    driver: local
  ssl_certs:
    driver: local
