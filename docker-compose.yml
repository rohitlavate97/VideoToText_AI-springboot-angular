services:
  # =========================================================================
  # PostgreSQL — Primary Relational Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: videototext-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videototext}
      POSTGRES_USER: ${POSTGRES_USER:-videototext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videototext_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videototext} -d ${POSTGRES_DB:-videototext}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # RabbitMQ — Message Broker with Management Plugin
  # =========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: videototext-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-videototext}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-videototext_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-videototext}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Redis — In-Memory Cache and Fast State Store
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: videototext-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-videototext_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-videototext_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # MinIO — S3-Compatible Object Storage
  # =========================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: videototext-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Bucket Auto-Creator
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: videototext-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET:-videototext};
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET:-videototext};
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
