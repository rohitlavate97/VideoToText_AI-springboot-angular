apiVersion: v1
kind: ConfigMap
metadata:
  name: videototext-config
  namespace: videototext
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DOMAIN_NAME: "videototext.ai"
  S3_ENDPOINT: "http://minio-service:9000"
  S3_BUCKET: "videototext"
  S3_REGION: "us-east-1"
  WORKER_CONCURRENCY: "2"
  DEFAULT_ASR_MODEL: "large-v3"
  DEFAULT_COMPUTE_TYPE: "float16"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: videototext-secrets
  namespace: videototext
type: Opaque
stringData:
  POSTGRES_DB: "videototext_prod"
  POSTGRES_USER: "videototext_user"
  POSTGRES_PASSWORD: "CHANGE_ME_K8S_POSTGRES_PASSWORD"
  RABBITMQ_USER: "videototext_admin"
  RABBITMQ_PASSWORD: "CHANGE_ME_K8S_RABBITMQ_PASSWORD"
  RABBITMQ_VHOST: "videototext"
  REDIS_PASSWORD: "CHANGE_ME_K8S_REDIS_PASSWORD"
  MINIO_ROOT_USER: "videototext_s3_admin"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_K8S_MINIO_PASSWORD"
  JWT_SECRET: "CHANGE_ME_K8S_JWT_SECRET_MUST_BE_AT_LEAST_64_CHARACTERS_LONG_HEX_STRING_FOR_SHA512"
