spring:
  datasource:
    url: jdbc:h2:mem:videototext_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  data:
    redis:
      repositories:
        enabled: false

app:
  jwt:
    secret: "test_secret_key_at_least_64_characters_long_for_unit_tests_abcdefghijklmnopqrstuvwxyz_1234567890"
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  storage:
    endpoint: "http://localhost:9000"
    access-key: "testadmin"
    secret-key: "testadmin"
    bucket: "videototext-test"
    region: "us-east-1"
  video:
    max-duration-minutes: 240
    max-file-size-bytes: 10737418240
    allowed-extensions: mp4,mkv,avi,mov,webm,flv,wmv,mpeg,3gp
  processing:
    mode: local
    chunk-duration-seconds: 600
