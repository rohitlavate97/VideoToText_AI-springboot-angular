name: VideoToText AI — Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Backend: Java 21 + Spring Boot 3.5.x
  # ===========================================================================
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Backend Tests
        working-directory: backend
        run: mvn clean test -B --no-transfer-progress

      - name: Build Application Package
        working-directory: backend
        run: mvn package -DskipTests -B --no-transfer-progress

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ===========================================================================
  # Frontend: Angular 17 + Node 20
  # ===========================================================================
  frontend-test:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Run Unit Tests (ChromeHeadless)
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Production Bundle Build
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser/
          retention-days: 7

  # ===========================================================================
  # AI Worker: Python 3.11 + Pytest + FFmpeg
  # ===========================================================================
  ai-worker-test:
    name: AI Worker Tests & Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-worker/requirements.txt

      - name: Install System Dependencies (FFmpeg & Libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install Python Dependencies
        working-directory: ai-worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Worker Pytest Suite
        working-directory: ai-worker
        run: python -m pytest tests/ -v

  # ===========================================================================
  # Docker Build Verification: Ensure Containers Build Cleanly
  # ===========================================================================
  docker-build-verification:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, ai-worker-test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: videototext-backend:ci-test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: videototext-frontend:ci-test

      - name: Build AI Worker Container (CPU)
        uses: docker/build-push-action@v5
        with:
          context: ./ai-worker
          file: ./ai-worker/Dockerfile
          push: false
          tags: videototext-ai-worker:ci-test
